name: snapshot

# Cadence is not hardcoded into the pipeline. Two schedules are defined here:
#   - a DAILY baseline that always runs
#   - an ELECTION-WINDOW cron (every 3h) that only does work when EITHER the
#     repository variable ELECTION_WINDOW == 'true' (Settings -> Secrets and
#     variables -> Actions -> Variables) OR today falls inside the automatic
#     high-cadence window declared in the gate step below.
#
# The variable is the manual override and still works in both directions. The date
# window exists so the general election does not depend on somebody remembering to
# flip it.
# Adjust the cron strings or the window dates to taste; keep the gating pattern.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"      # daily baseline, 08:00 UTC
    - cron: "0 */3 * * *"    # election-window cadence, every 3 hours (gated)

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    # The frequent cron is admitted to the job and then decided by the gate step,
    # because an `if:` expression here has no access to the current date. The cost
    # is a short runner start every 3 hours outside the window; the alternative is
    # having no automatic high-cadence period at all.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 8 * * *' ||
      github.event.schedule == '0 */3 * * *'
    runs-on: ubuntu-latest
    # Twelve targets: a run is seconds, not minutes. The cap is here only to stop
    # a hung fetch from burning the 6-hour default, and is generous against the
    # worst case of every target escalating to a headless render.
    timeout-minutes: 20
    steps:
      - name: Decide which states this run captures
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ELECTION_WINDOW: ${{ vars.ELECTION_WINDOW }}
        run: |
          set -euo pipefail

          # Automatic high-cadence windows, UTC, inclusive of both endpoints, and
          # PER STATE -- because this repo is the only one watching two states at
          # once, and their early voting periods are set by different statutes:
          #
          #   TX  early voting Oct 19 - Oct 30   (Election Code 85.001: the 17th
          #                                       day before election day is Sat
          #                                       Oct 17, so it slides to the next
          #                                       business day; ends the 4th day
          #                                       before)         -> opens Oct 15
          #   FL  early voting Oct 24 - Oct 31   (mandatory period, the 10th
          #                                       through 3rd day before)
          #                                                       -> opens Oct 20
          #
          # Each start is four days before ITS OWN early voting opens, matching
          # the lead the two county repos use, so the state series and its county
          # series raise cadence on the same day within a state. A single shared
          # start cannot do that: the previous value here was Oct 20, which is a
          # day AFTER Texas early voting opens, so the Texas ramp was missed
          # entirely while the comment claimed it was covered.
          #
          # Both ends are Nov 17. That one IS shared, and correctly so: election
          # day is Nov 3 in both states and the takedown curve is what the tail
          # is for.
          window_fl="20261020 20261117"
          window_tx="20261015 20261117"
          ALL_STATES="fl tx"

          today=$(date -u +%Y%m%d)
          open=""

          if [ "$EVENT" = "workflow_dispatch" ]; then
            open="$ALL_STATES"; why="manual dispatch — all states"
          elif [ "$SCHEDULE" = "0 8 * * *" ]; then
            open="$ALL_STATES"; why="daily baseline — all states"
          elif [ "${ELECTION_WINDOW:-}" = "true" ]; then
            open="$ALL_STATES"; why="ELECTION_WINDOW=true (manual override) — all states"
          else
            for s in $ALL_STATES; do
              eval "w=\$window_${s}"
              set -- $w
              if [ "$today" -ge "$1" ] && [ "$today" -le "$2" ]; then
                open="${open:+$open }$s"
              fi
            done
            if [ -n "$open" ]; then
              why="3-hourly cron — inside their own window: $open"
            else
              why="skipped: no state is inside its window and ELECTION_WINDOW is '${ELECTION_WINDOW:-unset}'"
            fi
          fi

          # Pass no --state when every state is captured, so snapshot.py treats it
          # as a full run and prunes directories no longer in the manifest. A
          # partial run passes --state and deliberately leaves the other state's
          # snapshots untouched, which is exactly what its prune guard already
          # does for a filtered run.
          args=""
          if [ -n "$open" ] && [ "$open" != "$ALL_STATES" ]; then
            for s in $open; do args="$args --state $s"; done
          fi

          go=false
          [ -n "$open" ] && go=true

          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "states=$open" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "capture=$go — $why"
          echo "### snapshot gate: \`$go\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$why" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run snapshot (fetch -> normalize -> write -> commit)
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "state-watch[bot]"
          git config user.email "actions@github.com"
          echo "capturing: ${{ steps.gate.outputs.states }}"
          python scripts/snapshot.py ${{ steps.gate.outputs.args }}

      # If the run died part-way (flaky site, network blip), pick up where it
      # left off rather than refetching everything. Same state filter, or a
      # resume would pull in states this run was never meant to capture.
      - name: Resume once if the run failed
        if: failure() && steps.gate.outputs.go == 'true'
        run: python scripts/snapshot.py --resume ${{ steps.gate.outputs.args }}

      - name: Push snapshot commit
        if: steps.gate.outputs.go == 'true'
        run: git push
