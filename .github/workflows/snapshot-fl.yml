name: snapshot-fl

# Florida state-level scraper, run out of fl/. Its Texas sibling snapshot-tx.yml
# is independent of it in every respect except the repository they both push to,
# which is what the concurrency group below is for.
#
# Cadence is not hardcoded into the pipeline:
#   - a DAILY baseline that always runs
#   - an ELECTION-WINDOW cron (every 3h) that only does work when EITHER the
#     repository variable ELECTION_WINDOW_FL == 'true' (Settings -> Secrets and
#     variables -> Actions -> Variables) OR today falls inside the automatic
#     window declared in the gate step below.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 8 * * *"     # daily baseline, 08:30 UTC
    - cron: "30 */3 * * *"   # election-window cadence, every 3 hours (gated)

# Shared with snapshot-fl.yml ON PURPOSE. Both workflows commit and push to the
# same branch, so they must never run at once; queueing costs a few minutes and
# avoids a push race. Texas's crons run 30 minutes earlier so the queue is
# usually empty anyway.
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    # The frequent cron is admitted to the job and then decided by the gate step,
    # because an `if:` expression here has no access to the current date.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '30 8 * * *' ||
      github.event.schedule == '30 */3 * * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fl
    # Six targets. The cap is generous against the worst case of every one
    # escalating to a headless render.
    timeout-minutes: 20
    steps:
      - name: Decide whether this run captures
        id: gate
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ELECTION_WINDOW: ${{ vars.ELECTION_WINDOW_FL }}
        run: |
          set -euo pipefail

          # Automatic high-cadence window, UTC, inclusive of both endpoints.
          #
          # Florida's mandatory early voting runs Oct 24 - Oct 31 (the 10th
          # through 3rd day before election day; counties may extend it from the
          # 15th to the 2nd). Oct 20 gives the same four-day lead into the ramp
          # that fl-county-watch uses, so the state and county series raise
          # cadence on the same day.
          #
          # Deliberately not snapshot-tx.yml's Oct 15 -- Texas early voting opens
          # Oct 19. Different statutes; do not sync them. The Nov 17 end is
          # shared, because election day is Nov 3 in both states and the tail is
          # there for the post-election takedown curve.
          WINDOW_START=20261020
          WINDOW_END=20261117

          today=$(date -u +%Y%m%d)
          go=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            go=true; why="manual dispatch"
          elif [ "$SCHEDULE" = "30 8 * * *" ]; then
            go=true; why="daily baseline"
          elif [ "${ELECTION_WINDOW:-}" = "true" ]; then
            go=true; why="ELECTION_WINDOW_FL=true (manual override)"
          elif [ "$today" -ge "$WINDOW_START" ] && [ "$today" -le "$WINDOW_END" ]; then
            go=true; why="inside automatic window ${WINDOW_START}..${WINDOW_END}"
          else
            why="skipped: outside ${WINDOW_START}..${WINDOW_END} and ELECTION_WINDOW_FL is '${ELECTION_WINDOW:-unset}'"
          fi

          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "capture=$go — $why"
          echo "### snapshot-fl gate: \`$go\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$why" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          # The push step needs the branch, not a detached HEAD.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run snapshot (fetch -> normalize -> write -> commit)
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "state-watch-fl[bot]"
          git config user.email "actions@github.com"
          python scripts/snapshot.py

      # If the run died part-way (flaky site, network blip), pick up where it
      # left off rather than refetching everything.
      - name: Resume once if the run failed
        if: failure() && steps.gate.outputs.go == 'true'
        run: python scripts/snapshot.py --resume

      # Rebase before pushing: the concurrency group serializes the two state
      # workflows, but a run that queued behind its sibling checked out before
      # the sibling's commit landed.
      - name: Push snapshot commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
