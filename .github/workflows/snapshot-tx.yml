name: snapshot-tx

# Texas state-level scraper, run out of tx/. Its Florida sibling snapshot-fl.yml
# is independent of it in every respect except the repository they both push to,
# which is what the concurrency group below is for.
#
# Cadence is not hardcoded into the pipeline:
#   - a DAILY baseline that always runs
#   - an ELECTION-WINDOW cron (every 3h) that only does work when EITHER the
#     repository variable ELECTION_WINDOW_TX == 'true' (Settings -> Secrets and
#     variables -> Actions -> Variables) OR today falls inside the automatic
#     window declared in the gate step below.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"      # daily baseline, 08:00 UTC
    - cron: "0 */3 * * *"    # election-window cadence, every 3 hours (gated)
    - cron: "23 * * * *"     # election-night cadence, hourly (gated)

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    # The frequent cron is admitted to the job and then decided by the gate step,
    # because an `if:` expression here has no access to the current date.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 8 * * *' ||
      github.event.schedule == '0 */3 * * *' ||
      github.event.schedule == '23 * * * *'
    runs-on: ubuntu-latest
    # Shared with snapshot-fl.yml ON PURPOSE. Both workflows commit and push to the
    # same branch, so they must never run at once; queueing costs a few minutes and
    # avoids a push race. Florida's crons are offset by 30 minutes so the queue is
    # usually empty anyway.
    # Set on this job rather than the workflow so the chain job below can wait
    # without holding the group.
    concurrency:
      group: snapshot
      cancel-in-progress: false
    outputs:
      go: ${{ steps.gate.outputs.go }}
    defaults:
      run:
        working-directory: tx
    # Six targets. The cap is generous against the worst case of every one
    # escalating to a headless render, and fits the run plus two resumes at the
    # 6-minute run deadline each.
    timeout-minutes: 30
    steps:
      - name: Decide whether this run captures
        id: gate
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ELECTION_WINDOW: ${{ vars.ELECTION_WINDOW_TX }}
        run: |
          set -euo pipefail

          # Automatic high-cadence window, UTC, inclusive of both endpoints.
          #
          # Texas early voting runs Oct 19 - Oct 30 (Election Code 85.001: the
          # 17th day before election day is Sat Oct 17, so it slides to the next
          # business day; it ends on the 4th day before). Oct 15 gives the same
          # four-day lead into the ramp that tx-county-watch uses, so the state
          # and county series raise cadence on the same day.
          #
          # Deliberately not snapshot-fl.yml's Oct 20 -- Florida's early voting
          # opens Oct 24. Different statutes; do not sync them. The Nov 17 end is
          # shared, because election day is Nov 3 in both states and the tail is
          # there for the post-election takedown curve.
          WINDOW_START=20261015
          WINDOW_END=20261117

          # Election-night window, UTC hours, start inclusive, end exclusive. The
          # 3-hourly cron fires about 5 times a day in practice (GitHub drops and
          # delays scheduled runs) and its worst gap is the 04:00-11:00 UTC stretch,
          # which on Nov 3-4 is results night. The hourly cron only captures inside
          # this window, from polls opening on Nov 3 to midday Nov 5. It is offset
          # from the hour because on-the-hour schedules are the ones GitHub sheds.
          # Overlapping firings queue in the concurrency group; a newer one replaces
          # an older pending one, so a slow run is followed by exactly one more.
          NIGHT_START=2026110312
          NIGHT_END=2026110512

          today=$(date -u +%Y%m%d)
          hour=$(date -u +%Y%m%d%H)
          go=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            go=true; why="manual dispatch"
          elif [ "$SCHEDULE" = "0 8 * * *" ]; then
            go=true; why="daily baseline"
          elif [ "$SCHEDULE" = "23 * * * *" ]; then
            if [ "$hour" -ge "$NIGHT_START" ] && [ "$hour" -lt "$NIGHT_END" ]; then
              go=true; why="inside election-night window ${NIGHT_START}..${NIGHT_END}"
            else
              why="skipped: hourly cron outside election-night window ${NIGHT_START}..${NIGHT_END}"
            fi
          elif [ "${ELECTION_WINDOW:-}" = "true" ]; then
            go=true; why="ELECTION_WINDOW_TX=true (manual override)"
          elif [ "$today" -ge "$WINDOW_START" ] && [ "$today" -le "$WINDOW_END" ]; then
            go=true; why="inside automatic window ${WINDOW_START}..${WINDOW_END}"
          else
            why="skipped: outside ${WINDOW_START}..${WINDOW_END} and ELECTION_WINDOW_TX is '${ELECTION_WINDOW:-unset}'"
          fi

          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "capture=$go — $why"
          echo "### snapshot-tx gate: \`$go\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$why" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          # The push step needs the branch, not a detached HEAD.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run snapshot (fetch -> normalize -> write -> commit)
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "state-watch-tx[bot]"
          git config user.email "actions@github.com"
          python scripts/snapshot.py

      # If the run died part-way (flaky site, network blip), pick up where it
      # left off rather than refetching everything.
      - name: Resume once if the run failed
        id: resume1
        if: failure() && steps.gate.outputs.go == 'true'
        run: python scripts/snapshot.py --resume

      # A resume that also hits the run deadline exits non-zero with its
      # checkpoint intact, so one more pass finishes the tail. Without it the
      # slowest targets keep a stale snapshot whenever county sites are slow,
      # which is exactly when they matter.
      - name: Resume again if the first resume also hit its deadline
        if: failure() && steps.resume1.outcome == 'failure' && steps.gate.outputs.go == 'true'
        run: python scripts/snapshot.py --resume

      # Rebase before pushing: the concurrency group serializes the two state
      # workflows, but a run that queued behind its sibling checked out before
      # the sibling's commit landed.
      # Push even after a failed step: a run that hit its deadline has still
      # committed what it captured. (Without !cancelled() this step was skipped
      # after any failure, so a successful --resume never reached the remote.)
      - name: Push snapshot commit
        if: ${{ !cancelled() && steps.gate.outputs.go == 'true' }}
        run: |
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

  # Election-night backup for GitHub's scheduler, which started only 1-2 runs
  # per workflow on Nov 2. After each capture this job waits until an hour
  # after the capture began, then starts the next run itself. A run started
  # with GITHUB_TOKEN through workflow_dispatch does execute, unlike most
  # token-triggered events, so the chain keeps going without the scheduler.
  # It stops at CHAIN_END, and starts nothing while a newer run of this
  # workflow is queued or going: that run continues the chain instead. Only
  # newer runs count. On Nov 4 a scheduled run overlapped a chained one, each
  # saw the other as active (the older only because its own chain job was
  # still sleeping), both stood down, and the chain died. Run ids increase
  # with creation, so exactly one run, the newest, is responsible.
  chain:
    needs: snapshot
    if: ${{ !cancelled() && needs.snapshot.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Start the next run after the spacing interval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          CHAIN_START=2026110313   # UTC hour, inclusive
          CHAIN_END=2026110512     # UTC hour, exclusive -- same as the hourly gate
          GAP_MIN=60               # minimum spacing between run starts

          wf=$(basename "${WORKFLOW_REF%@*}")
          in_window() {
            h=$(date -u +%Y%m%d%H)
            [ "$h" -ge "$CHAIN_START" ] && [ "$h" -lt "$CHAIN_END" ]
          }
          newer_active() {
            gh run list -R "$REPO" -w "$wf" --limit 20 --json databaseId,status \
              -q "[.[] | select(.databaseId > $RUN_ID)
                       | select(.status == \"queued\" or .status == \"in_progress\"
                                or .status == \"pending\" or .status == \"waiting\")] | length"
          }

          in_window || { echo "outside ${CHAIN_START}..${CHAIN_END}, chain ends"; exit 0; }
          [ "$(newer_active)" -eq 0 ] || { echo "a newer run is active and continues the chain"; exit 0; }

          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID" -q .run_started_at)
          wait_s=$(( $(date -u -d "$started" +%s) + GAP_MIN * 60 - $(date -u +%s) ))
          if [ "$wait_s" -gt 0 ]; then
            echo "run started $started; waiting ${wait_s}s"
            sleep "$wait_s"
          fi

          in_window || { echo "window closed while waiting, chain ends"; exit 0; }
          [ "$(newer_active)" -eq 0 ] || { echo "a newer run started while waiting and continues the chain"; exit 0; }
          gh workflow run "$wf" -R "$REPO" --ref "$REF"
          echo "started the next $wf run"
